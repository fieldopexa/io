<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSM Browser Direct Upload Test v2</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0f12;color:#eef2f8}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0d0f12}
.card{width:min(680px,100%);background:#14171c;border:1px solid #29303a;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0006}
h1{font-size:22px;margin:0 0 8px}p{color:#aeb8c7;line-height:1.55}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
input[type=file]{width:100%;padding:14px;border:1px dashed #3a4655;border-radius:12px;background:#101318;color:#eef2f8}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:#eef2f8;color:#11161c;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:18px;padding:14px;border:1px solid #29303a;border-radius:12px;background:#0f1216;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.progress{height:10px;background:#242a33;border-radius:999px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#eef2f8;transition:width .15s linear}.good{color:#94e2b1}.bad{color:#ff9d9d}.muted{font-size:12px;color:#8490a0}
</style>
</head>
<body>
<div class="card">
  <h1>FSM Browser → Google Drive Test v2</h1>
  <p>This is only a transport test. Sign in to your normal FSM first on the same GitHub Pages domain, then open this page and upload one small JPG/PNG/WEBP/PDF.</p>
  <div id="auth" class="muted">Checking FSM session…</div>
  <div class="row"><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div>
  <div class="row"><button id="start" disabled>Start Direct Upload Test</button></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="status" class="status">Waiting.</div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwSkuGoiYcggbR1bj-83Q1XDBWl3UI8yDcUpyBbuvN7OAo9DZd3qGucv0QdLWPldJA/exec';
const fileInput=document.getElementById('file');
const startBtn=document.getElementById('start');
const statusEl=document.getElementById('status');
const authEl=document.getElementById('auth');
const bar=document.getElementById('bar');
let authToken='';

function log(msg, cls=''){
  statusEl.className='status '+cls;
  statusEl.textContent=msg;
}
function loadSession(){
  try{
    const raw=localStorage.getItem('fo-auth')||sessionStorage.getItem('fo-auth');
    const saved=raw?JSON.parse(raw):null;
    if(!saved?.token){
      authEl.textContent='No FSM session found. Open the normal FSM, sign in, then return here.';
      authEl.className='muted bad';
      return false;
    }
    if(saved.expiresAt && Date.now()>Number(saved.expiresAt)){
      authEl.textContent='FSM session is expired. Sign in to FSM again first.';
      authEl.className='muted bad';
      return false;
    }
    authToken=saved.token;
    authEl.textContent='FSM session found. Ready for browser upload test.';
    authEl.className='muted good';
    startBtn.disabled=false;
    return true;
  }catch(e){
    authEl.textContent='Could not read FSM session: '+e.message;
    authEl.className='muted bad';
    return false;
  }
}

async function createSession(file){
  const res=await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({
      action:'beginBrowserDriveUploadTest',
      token:authToken,
      fileName:file.name,
      mimeType:file.type,
      sizeBytes:file.size,
      origin:location.origin
    })
  });
  if(!res.ok) throw new Error('Apps Script request failed: HTTP '+res.status);
  const data=await res.json();
  if(data.status==='error') throw new Error(data.error||'Could not create upload session.');
  if(!data.uploadUrl) throw new Error('No Drive upload URL was returned.');
  return data;
}

function uploadDirect(uploadUrl,file){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('PUT',uploadUrl,true);
    // Do not add custom request headers here. The upload session already knows
    // the MIME type, and fewer custom headers keeps the browser CORS request simpler.
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        const pct=Math.max(1,Math.round((e.loaded/e.total)*100));
        bar.style.width=pct+'%';
        log('Uploading directly to Google Drive… '+pct+'%');
      }
    };
    xhr.onerror=()=>reject(new Error('Browser upload failed. If Console shows a CORS error, send that error to ChatGPT.'));
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){
        let meta={};
        try{meta=JSON.parse(xhr.responseText||'{}')}catch(e){}
        resolve(meta);
      }else{
        reject(new Error('Google Drive upload returned HTTP '+xhr.status+' '+(xhr.responseText||'')));
      }
    };
    xhr.send(file);
  });
}

startBtn.addEventListener('click',async()=>{
  const file=fileInput.files?.[0];
  if(!file){log('Choose one file first.','bad');return;}
  const allowed=['image/jpeg','image/png','image/webp','application/pdf'];
  if(!allowed.includes(file.type)){log('Only JPG, PNG, WEBP, or PDF is allowed.','bad');return;}
  if(file.size>6*1024*1024){log('Choose a file under 6 MB for this test.','bad');return;}
  startBtn.disabled=true;bar.style.width='0%';
  try{
    log('Step 1/2: Asking Apps Script for a Drive upload session…');
    const session=await createSession(file);
    log('Step 1/2 complete. Session bound to browser origin: '+(session.originUsed||location.origin)+'\nStep 2/2: Uploading browser → Google Drive directly…');
    const meta=await uploadDirect(session.uploadUrl,file);
    bar.style.width='100%';
    log('SUCCESS\n\nBrowser uploaded directly to Google Drive.\nFile: '+(meta.name||session.fileName||file.name)+'\nDrive file ID: '+(meta.id||'(returned without ID)'),'good');
  }catch(e){
    console.error(e);
    log('FAILED\n\n'+(e.message||e)+'\n\nOpen F12 → Console and send the red error if shown.','bad');
  }finally{
    startBtn.disabled=false;
  }
});
loadSession();
</script>
</body>
</html>
