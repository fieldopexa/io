name: Validate FSM Communications
on:
  push:
    branches:
      - feature/fsm-live-chat-v1
  pull_request:
    paths:
      - 'live-chat.js'
      - 'live-chat.css'
      - 'index.html'
      - 'fieldlog-chat.css'
      - 'sw.js'
      - 'FirebaseChatSSO.gs'
      - 'FirebaseChatPush.gs'
      - 'firestore.rules'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify client and worker JavaScript syntax
        run: |
          node --check live-chat.js
          node --check sw.js
          node --check chat-config.js
      - name: Verify Apps Script helpers compile as JavaScript
        run: |
          cp FirebaseChatSSO.gs /tmp/fsm-sso.js
          cp FirebaseChatPush.gs /tmp/fsm-push.js
          node --check /tmp/fsm-sso.js
          node --check /tmp/fsm-push.js
      - name: Check mobile inbox and conversation navigation wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('live-chat.js','utf8');
          const css = fs.readFileSync('live-chat.css','utf8');
          const html = fs.readFileSync('index.html','utf8');
          for (const id of ['fsm-chat-back','fsm-chat-filter-unread','fsm-chat-filter-all','fsm-chat-contacts','fsm-chat-search']) {
            assert(js.includes('id="'+id+'"'), 'Missing mobile control: '+id);
          }
          assert(js.includes("selectRoom(state.room,false)"), 'Must default to inbox on mobile');
          assert(js.includes("showChatScreen('thread')"), 'Tap a conversation must open a thread');
          assert(js.includes("el('fsm-chat-back').addEventListener('click',backToInbox)"), 'Mobile back control not wired');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-sidebar{display:none!important}'), 'Inbox not hidden in thread mode');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-thread{display:flex}'), 'Thread not visible when selected');
          assert(css.includes('overflow-x:hidden;overflow-y:auto'), 'Mobile inbox should be a vertically scrolling list');
          assert(js.includes("name:'Saved Messages'"), 'Private self-chat lost');
          assert(js.includes('isRecentlyActive'), 'Active indicators lost');
          assert(html.includes('live-chat.js?v=fsm-auto-visit-feedback-manual-20261028'), 'Stale chat script URL');
          assert(!js.includes('OPEXA / MESSAGES'), 'Redundant inbox eyebrow is still present');
          assert(!js.includes('<h3>Inbox</h3>'), 'Redundant inbox header is still present');
          assert(js.includes("name:'FSE Team'"), 'FSE group name not updated');
          assert(js.includes('global-search fsm-chat-search-wrap'), 'Field Logs search component is not reused');
          assert(!css.includes('.fsm-chat-sidebar-heading'), 'Unused inbox heading styling remains');
          assert(!js.includes("el('fsm-chat-signout').addEventListener"), 'Old removed element reference remains');
          console.log('FSM mobile chat navigation and UX wiring checks passed.');
          NODE
      - name: Parse inline FSM scripts and validate incident handoff
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html','utf8');
          const js = fs.readFileSync('live-chat.js','utf8');
          const sw = fs.readFileSync('sw.js','utf8');
          const matches = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let parsed=0;
          for(const match of matches){
            const attrs=match[1];
            if(/\bsrc\s*=/.test(attrs))continue;
            if(/\btype\s*=\s*['"]?(?:application\/json|text\/template|module)/i.test(attrs))continue;
            if(!match[2].trim())continue;
            new vm.Script(match[2], {filename:'index.html inline script '+(++parsed)});
          }
          assert(parsed>0,'No FSM JavaScript was checked');
          assert(html.includes('function discussFieldLog(id)'), 'Incident discussion function not found');
          assert(html.includes('function openRequestedFSMFieldLog()'), 'Deep link opener missing');
          assert(html.includes('openRequestedFSMFieldLog();'), 'Deep link opener not called after loadEntries');
          assert(html.includes('function isChatDiscussableVisit(entry)'), 'Incident-only scope missing');
          assert(html.includes('data-discuss-visit='), 'Field Logs Discuss in Chat action not present');
          assert(html.includes("container.prepend(discuss)"), 'Detail drawer discuss button missing');
          assert(js.includes('window.fsmChatPrepareDraft=payload=>'), 'Chat draft handoff missing');
          assert(js.includes("selectRoom('engineering')"), 'Draft not opening FSE Team');
          assert(js.includes("url.searchParams.get('fieldlog')"), 'Chat not opening Field Log links');
          assert(fs.existsSync('fieldlog-chat.css'), 'Discussion stylesheet missing');
          assert(sw.includes("'./fieldlog-chat.css'"), 'Missing cached discussion stylesheet');
          // Automatic announcements are strictly tied to a confirmed new visit.
          const committedAt=html.indexOf("window.dispatchEvent(new CustomEvent('visit-committed'");
          const saveAt=html.indexOf("const visitSaveResult=await apiPost(isEdit?'updateEntry':'addEntry'");
          assert(saveAt>=0&&committedAt>saveAt,'Auto-notification event must follow confirmed Apps Script save');
          assert(js.includes("window.addEventListener('visit-committed'"),'Chat listener for confirmed visits missing');
          assert(js.includes('if(event.detail?.isEdit)return;'),'Edits must not trigger visit announcements');
          assert(js.includes("const ref=doc(state.db,'chatRooms','engineering','messages','visit_'+item.id)"),'Stable message ID to prevent duplicate visit updates missing');
          assert(js.includes('runTransaction(state.db,async tx=>'),'Visit announcements must use idempotent Firestore transaction');
          assert(js.includes("localStorage.setItem(visitAnnounceKey(username)"),'Failed notifications must be kept in retry queue');
          assert(js.includes('renderVisitNotice(body,msg)'),'Dedicated field-visit notification card missing');
          assert(js.includes("window.addEventListener('online'"),'Missing reconnect handler for pending announcements');
          assert(html.includes('id="fsm-visit-chat-status"'), 'Visit notification status UI missing');
          assert(html.includes("window.addEventListener('fsm-visit-announcement-status'"),'Visit save outcome feedback listener missing');
          assert(js.includes("visitAnnouncementStatus(item.id,'posted')"), 'No successful notification status');
          assert(js.includes("visitAnnouncementStatus(item.id,'pending')"), 'No pending notification status');
          assert(js.includes('scheduleVisitAnnouncementRetry();'), 'Transient errors will not be retried');
          assert(html.includes('function announceExistingFieldLog(id)'), 'Existing visit manual notify fallback missing');
          assert(html.includes('>Notify FSE Team</button>'), 'Existing visit notification menu action missing');
          assert(js.includes('window.fsmChatAnnounceExistingVisit=entry=>queueVisitAnnouncement(entry)'), 'Manual notification must reuse idempotent queue');

          assert(html.includes("if(!isEdit&&chatStatus)"), 'Visit notifications must only be prepared for new logs');

          console.log('Validated '+parsed+' inline scripts and incident/chat integration.');
          NODE
      - name: Check chat rule sections are present
        run: |
          grep -Fq "match /chatRooms/{roomId}/messages/{messageId}" firestore.rules
          grep -Fq "request.resource.data.diff(resource.data)" firestore.rules
          grep -Fq "match /chatPresence/{uid}" firestore.rules
