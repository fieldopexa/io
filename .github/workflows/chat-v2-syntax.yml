name: Validate FSM Communications
on:
  push:
    branches:
      - main
      - feature/fsm-live-chat-v1
  pull_request:
    paths:
      - 'live-chat.js'
      - 'visit-notifications.js'
      - 'visit-notifications.css'
      - 'live-chat.css'
      - 'index.html'
      - 'api.gs'
      - 'fieldlog-chat.css'
      - 'sw.js'
      - 'FirebaseChatSSO.gs'
      - 'FirebaseChatPush.gs'
      - 'firestore.rules'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify client and worker JavaScript syntax
        run: |
          node --check live-chat.js
          node --check visit-notifications.js
          node --check sw.js
          node --check chat-config.js
      - name: Verify Apps Script helpers compile as JavaScript
        run: |
          cp FirebaseChatSSO.gs /tmp/fsm-sso.js
          cp FirebaseChatPush.gs /tmp/fsm-push.js
          node --check /tmp/fsm-sso.js
          node --check /tmp/fsm-push.js
      - name: Check mobile inbox and conversation navigation wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('live-chat.js','utf8');
          const css = fs.readFileSync('live-chat.css','utf8');
          const html = fs.readFileSync('index.html','utf8');
          for (const id of ['fsm-chat-back','fsm-chat-filter-unread','fsm-chat-filter-all','fsm-chat-contacts','fsm-chat-search']) {
            assert(js.includes('id="'+id+'"'), 'Missing mobile control: '+id);
          }
          assert(js.includes("selectRoom(state.room,false)"), 'Must default to inbox on mobile');
          assert(js.includes("showChatScreen('thread')"), 'Tap a conversation must open a thread');
          assert(js.includes("el('fsm-chat-back').addEventListener('click',backToInbox)"), 'Mobile back control not wired');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-sidebar{display:none!important}'), 'Inbox not hidden in thread mode');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-thread{display:flex}'), 'Thread not visible when selected');
          assert(css.includes('overflow-x:hidden;overflow-y:auto'), 'Mobile inbox should be a vertically scrolling list');
          assert(js.includes("name:'Saved Messages'"), 'Private self-chat lost');
          assert(js.includes('isRecentlyActive'), 'Active indicators lost');
          assert(html.includes('live-chat.js?v=fsm-notif-center-no-autopost-20261029'), 'Stale chat script URL');
          assert(!js.includes('OPEXA / MESSAGES'), 'Redundant inbox eyebrow is still present');
          assert(!js.includes('<h3>Inbox</h3>'), 'Redundant inbox header is still present');
          assert(js.includes("name:'FSE Team'"), 'FSE group name not updated');
          assert(js.includes('global-search fsm-chat-search-wrap'), 'Field Logs search component is not reused');
          assert(!css.includes('.fsm-chat-sidebar-heading'), 'Unused inbox heading styling remains');
          assert(!js.includes("el('fsm-chat-signout').addEventListener"), 'Old removed element reference remains');
          console.log('FSM mobile chat navigation and UX wiring checks passed.');
          NODE
      - name: Parse inline FSM scripts and validate incident handoff
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html','utf8');
          const js = fs.readFileSync('live-chat.js','utf8');
          const sw = fs.readFileSync('sw.js','utf8');
          const matches = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let parsed=0;
          for(const match of matches){
            const attrs=match[1];
            if(/\bsrc\s*=/.test(attrs))continue;
            if(/\btype\s*=\s*['"]?(?:application\/json|text\/template|module)/i.test(attrs))continue;
            if(!match[2].trim())continue;
            new vm.Script(match[2], {filename:'index.html inline script '+(++parsed)});
          }
          assert(parsed>0,'No FSM JavaScript was checked');
          assert(html.includes('function discussFieldLog(id)'), 'Incident discussion function not found');
          assert(html.includes('function openRequestedFSMFieldLog()'), 'Deep link opener missing');
          assert(html.includes('openRequestedFSMFieldLog();'), 'Deep link opener not called after loadEntries');
          assert(html.includes('function isChatDiscussableVisit(entry)'), 'Incident-only scope missing');
          assert(html.includes('data-discuss-visit='), 'Field Logs Discuss in Chat action not present');
          assert(html.includes("container.prepend(discuss)"), 'Detail drawer discuss button missing');
          assert(js.includes('window.fsmChatPrepareDraft=payload=>'), 'Chat draft handoff missing');
          assert(js.includes("selectRoom('engineering')"), 'Draft not opening FSE Team');
          assert(js.includes("url.searchParams.get('fieldlog')"), 'Chat not opening Field Log links');
          assert(fs.existsSync('fieldlog-chat.css'), 'Discussion stylesheet missing');
          assert(sw.includes("'./fieldlog-chat.css'"), 'Missing cached discussion stylesheet');
          // New visits are represented once in Field Logs; notification state
          // is derived from those shared records, never posted into FSE Team.
          const committedAt=html.indexOf("window.dispatchEvent(new CustomEvent('visit-committed'");
          const saveAt=html.indexOf("const visitSaveResult=await apiPost(isEdit?'updateEntry':'addEntry'");
          assert(saveAt>=0&&committedAt>saveAt,'Visit-created event must follow a confirmed Apps Script save');
          assert(!js.includes("window.addEventListener('visit-committed'"),'Group chat must not auto-announce new visits');
          assert(!js.includes("function flushVisitAnnouncements()"),'Old queued auto-posts must not be retried');
          assert(!html.includes('data-tab="notifications"'),'Notifications should not appear in desktop navigation');
          assert(!html.includes('data-mobile-tab="notifications"'),'Notifications should not appear in mobile menu');
          assert(!html.includes('id="panel-notifications"'),'Old notifications page should be removed');
          assert(html.includes('id="fsm-notif-bell-desktop"'),'Desktop header bell missing');
          assert(html.includes('id="fsm-notif-bell-mobile"'),'Mobile header bell missing');
          assert(html.includes('class="fsm-workspace-tools"'),'Bell must be in the workspace rather than the sidebar');
          assert(html.includes('id="fsm-notif-popover"'),'Notification dropdown missing');
          assert(html.includes('window.fsmNotificationsFetch=async()=>'),'Authenticated shared visit fetch missing');
          assert(html.includes('window.fsmNotificationsSync?.(entries)'),'Visit data does not update notification center');
          assert(html.includes('visit-notifications.js'),'Notification script not loaded');
          assert(fs.existsSync('visit-notifications.css'),'Notification styles missing');
          const notificationStyles=fs.readFileSync('visit-notifications.css','utf8');
          assert(notificationStyles.includes('#fsm-notif-popover[hidden]{display:none!important}'),'Bell popover hidden state missing');
          assert(notificationStyles.includes('position:sticky;top:12px'),'Desktop bell not anchored at top-right');
          const notifications=fs.readFileSync('visit-notifications.js','utf8');
          assert(notifications.includes("window.addEventListener('visit-committed'"),'Confirmed saves must refresh the activity feed');
          assert(notifications.includes('window.setInterval(poll,60000)'), 'Background refresh interval missing');
          assert(html.includes('data-fsm-notif-filter="read"'), 'Read status filter missing');
          assert(html.includes('data-fsm-notif-filter="archived"'), 'Archived status filter missing');
          assert(notifications.includes("archived=new Set()"), 'Per-user archive state missing');
          assert(notifications.includes('function archiveVisit(id)'), 'Archive action missing');
          assert(notifications.includes('function restoreVisit(id)'), 'Restore action missing');
          assert(notifications.includes('function markUnread(id)'), 'Mark as unread action missing');
          assert(notifications.includes("!archived.has(r.id)&&!read.has(r.id)"), 'Archived notices still count as unread');
          assert(notifications.includes("filter==='archived'"), 'Archived tab is not wired');
          assert(notifications.includes("filter==='read'"), 'Read tab is not wired');
          assert(notifications.includes('!event.detail?.entry'), 'Visit notices must require a confirmed save');
          assert(notifications.includes('window.fsmNotificationsOpen=()=>openPopover()'),'Bell opening interaction missing');
          assert(notifications.includes("event.key==='Escape'"),'Bell dialog Escape close missing');
          assert(notifications.includes("popover.contains(event.target)"),'Click outside close missing');
          assert(notifications.includes("closePopover();openFieldLog(r.id)"),'Notification selection must return to the visit');
          assert(notifications.includes('window.fsmOpenFieldLogFromChat'), 'Activity items must link to original Field Log');
          assert(!notifications.includes("'chatRooms'"),'Visit feed must not write chat messages');
          assert(sw.includes("'./visit-notifications.js'"),'Offline cache missing notification script');
          assert(js.includes('window.fsmChatPrepareDraft=payload=>'), 'Manual Discuss in Chat button must remain supported');
          assert(html.includes('function discussFieldLog(id)'), 'Manual incident discussion removed');
          assert(!html.includes('>Notify FSE Team</button>'),'Old duplicate group notify action still present');

          console.log('Validated '+parsed+' inline scripts and incident/chat integration.');
          NODE
      - name: Validate team-wide Field Logs access and edit ownership
        run: |
          cp api.gs /tmp/fsm-backend.js
          node --check /tmp/fsm-backend.js
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const backend=fs.readFileSync('api.gs','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const sandbox=vm.createContext({});
          vm.runInContext(backend,sandbox,{timeout:3000});
          const ian={username:'ian',fse:'Ian',role:'fse'};
          const popoy={username:'popoy',fse:'Popoy',role:'fse'};
          const mgmt={username:'manager',role:'management'};
          const record={id:'visit-01',tech:'Ian',supportingFses:'Popoy'};
          assert.doesNotThrow(()=>sandbox.requirePrimaryFseFieldLogOwner_(ian,record));
          assert.throws(()=>sandbox.requirePrimaryFseFieldLogOwner_(popoy,record),/another FSE/);
          assert.throws(()=>sandbox.requirePrimaryFseFieldLogOwner_(mgmt,record),/Only an authenticated/);
          assert.doesNotThrow(()=>sandbox.requireFseFieldLogWrite_(popoy));
          assert.throws(()=>sandbox.requireFseFieldLogWrite_(mgmt),/Only an authenticated/);
          assert(!backend.includes("rows = rows.filter(function(row) { return fseOwnsVisit_(user, row); });"),'Backend still restricts FSE reads');
          assert(backend.includes("requirePrimaryFseFieldLogOwner_(user, beforeEntry)"),'Backend update ownership guard missing');
          assert(backend.includes("requirePrimaryFseFieldLogOwner_(user, beforeArchive)"),'Backend void ownership guard missing');
          assert(backend.includes("if (forWrite) requirePrimaryFseFieldLogOwner_(user, entry)"),'Attachment write owner guard missing');
          assert(backend.includes("requireVisitAttachmentAccess_(user, uploadVisitId, true)"),'File upload lacks owner guard');
          assert(backend.includes("requireVisitAttachmentAccess_(user, directVisitId, true)"),'Direct Drive upload lacks owner guard');
          assert(backend.includes("requireVisitAttachmentAccess_(user, visitIdForSession, true)"),'Drive session lacks owner guard');
          assert(html.includes("return Array.isArray(rows)?rows:[]"),'Client still limits FSE history');
          assert(html.includes("activeWork==='mine'&&!isMyFieldLogWork(e)"),'My Work filter missing');
          assert(html.includes('id="log-fse-filter"'), 'FSE selector missing');
          assert(html.includes("if(!canEditFieldLog(e)){fieldLogEditDenied();return;}"),'Client edit/void guards missing');
          assert(html.includes("currentUser?.role!=='fse'"),'Client role gate missing');
          assert(html.includes("document.getElementById('work-toggle').hidden=false"),'FSE work switch still hidden');
          console.log('PASS: shared reads and primary-owner-only backend writes for Ian, Popoy, Management.');
          NODE
      - name: Check chat rule sections are present
        run: |
          grep -Fq "match /chatRooms/{roomId}/messages/{messageId}" firestore.rules
          grep -Fq "request.resource.data.diff(resource.data)" firestore.rules
          grep -Fq "match /chatPresence/{uid}" firestore.rules
