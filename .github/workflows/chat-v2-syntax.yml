name: Validate FSM Communications
on:
  push:
    branches:
      - feature/fsm-live-chat-v1
  pull_request:
    paths:
      - 'live-chat.js'
      - 'live-chat.css'
      - 'index.html'
      - 'sw.js'
      - 'FirebaseChatSSO.gs'
      - 'FirebaseChatPush.gs'
      - 'firestore.rules'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify client and worker JavaScript syntax
        run: |
          node --check live-chat.js
          node --check sw.js
          node --check chat-config.js
      - name: Verify Apps Script helpers compile as JavaScript
        run: |
          cp FirebaseChatSSO.gs /tmp/fsm-sso.js
          cp FirebaseChatPush.gs /tmp/fsm-push.js
          node --check /tmp/fsm-sso.js
          node --check /tmp/fsm-push.js
      - name: Check mobile inbox and conversation navigation wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('live-chat.js','utf8');
          const css = fs.readFileSync('live-chat.css','utf8');
          const html = fs.readFileSync('index.html','utf8');
          for (const id of ['fsm-chat-back','fsm-chat-filter-unread','fsm-chat-filter-all','fsm-chat-contacts','fsm-chat-search']) {
            assert(js.includes('id="'+id+'"'), 'Missing mobile control: '+id);
          }
          assert(js.includes("selectRoom(state.room,false)"), 'Must default to inbox on mobile');
          assert(js.includes("showChatScreen('thread')"), 'Tap a conversation must open a thread');
          assert(js.includes("el('fsm-chat-back').addEventListener('click',backToInbox)"), 'Mobile back control not wired');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-sidebar{display:none!important}'), 'Inbox not hidden in thread mode');
          assert(css.includes('#fsm-chat-panel.fsm-chat-mobile-thread .fsm-chat-thread{display:flex}'), 'Thread not visible when selected');
          assert(css.includes('overflow-x:hidden;overflow-y:auto'), 'Mobile inbox should be a vertically scrolling list');
          assert(js.includes("name:'Saved Messages'"), 'Private self-chat lost');
          assert(js.includes('isRecentlyActive'), 'Active indicators lost');
          assert(html.includes('live-chat.js?v=fsm-comms-v4-search-fse-20261028'), 'Stale chat script URL');
          assert(!js.includes('OPEXA / MESSAGES'), 'Redundant inbox eyebrow is still present');
          assert(!js.includes('<h3>Inbox</h3>'), 'Redundant inbox header is still present');
          assert(js.includes("name:'FSE Team'"), 'FSE group name not updated');
          assert(js.includes('global-search fsm-chat-search-wrap'), 'Field Logs search component is not reused');
          assert(!css.includes('.fsm-chat-sidebar-heading'), 'Unused inbox heading styling remains');
          assert(!js.includes("el('fsm-chat-signout').addEventListener"), 'Old removed element reference remains');
          console.log('FSM mobile chat navigation and UX wiring checks passed.');
          NODE
      - name: Check chat rule sections are present
        run: |
          grep -Fq "match /chatRooms/{roomId}/messages/{messageId}" firestore.rules
          grep -Fq "request.resource.data.diff(resource.data)" firestore.rules
          grep -Fq "match /chatPresence/{uid}" firestore.rules
